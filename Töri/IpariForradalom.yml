Mi az ipari forradalom:
  - Komplex nemzetgazdasági átalakulás amley érinti az élet minden területét.
  - Pl:
    - Demográfiai változatok:
      - Demográfia: Népesség változással foglalkozó tudomány
    - Urbanizációs Változásk:
      - Urbanizáció:
        - Várososodás
        - Várossá vállás
    - Társadalmi változásk
    - Infrastruktúrális változatok:
      - A termelést kiegészítő ágazatok összesége (Oktatás,Közlekedeés,Hitel inézetek, Szenyvíz)
Az ipari forradalom szakaszai:
  - 1 szakasz I ipari forradalom:
    - 18.sz közepe - 19.sz feléig
    - Vezető ország Anglia
    - Húzó ágazat kezdetben a Textil ipar, majd Vasútépítés,Nehéz ipar
  - 2 szakasz II ipari forradalom:
    - 1870-esévek
    - Vezető országai USA Németország
    - Húzó ágazat:
      - Nehéz ipar
      - Új iparok:
        - Vegyipar
        - Autó ipar
        - Elektromos ipar
    - Egyenlőtlen fejlődés:
      - Az ipari forradalomba későb bekapcsolódó országok (USA, Németország) gyorsabb ipari fejlődést produkál mint az addig élen járó országok (Anglia, Francia)
  - 3 szakasz a 2 világháború közöztt:
    - Vezető ország
    - Húzó ágazat:
      - Háztartási cikkek
  - 4 szakasz 2 világháború után:
    - Tudománys technológiai forradalom 
    - Nagyon gyorsan átkrülnek a háztartőásokban a tudományos felfedezések
    - Nagyon fontos a fegyverek fejlesztése
    - Fegyverkezési verseny (Hideg háború)
  - 5 szakasz 21.század:
    - Húzó ágazat:
      - Mikroelektronika
      - biotechnologiai
      - informácios technologia
    - Vezető országok:
      - USA
      - Kína
      - India
Miért Angliából indul ki az ipar forradalom:
  - Megindult a tőkés átalakulás agazdaságban
  - 17.században lemegy a polgári forradalom Polgiri átalakulás gazdaság politika
  - Jólműködő hitel szervezet
  - Nyersanyag gazdagsák
  - Gyarmatosításban az élen jár ez piaci lehetőségéket ad nekik
  - A tengerek urává válik 
  - Gőzgép létrehozása a bányavíz megoldására létrejön (James Watth)
  - időbeli elhejezés: 18.század 3. harmada 1769

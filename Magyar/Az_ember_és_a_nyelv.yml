- A nyelvi képeség az humánspecifikus
- nyelv:
  - Csak az emberek általt használt, összetett jelrendszert
- A nyelv elsajátításához szügséges az elvont gondolkodásra, absztrekcióra való képesség
- Ember:
  - tagolt
  - tanult
  - nyitott
- Állat:
  - tagolatlan
  - öröklöt
  - zárt
- A társas lények bonyolultap kommunikációs rendszerrel rendelkeznek
- Nyelv és gondolkodás:
  - Nyelvi relativizms:
    - Az anyanyelv meghatározza a gondolkodást
  - Nyelvi determinizmus:
    - a nyelv nemcsak meghatározza, de korlátozza is a gondolkodást
  - Ludvig Wittgenstein (filozófus):
    - "nyelvem határai egybaen a világom határai is"
  - A Nyelvi kép:
    - Wilhelrm von Humboldt:
      - "nyelvi világkép":
        - "minden nyelvnek önnáló világszemlélete van"
        - Pl.:
          - nyelvtani nemek, jelentések, fogalomcsoportok (eszkimók), viselkedésminták (mi számít udvarias)
  - De:
    - Azonban külömböző kultúrák képesek valamien szinten megértei egymást
    - lefordítothatóak a nyelvek 
    - Tehát: az emberi gondolkodás alapvetően azonos
  - Összegzés:
    - Gondolkodásunkat, világképünket a nyelv befolyásolja, de nem korlátozza
    - Nyelvi relativizms /
    - Nyelvi diterminizmus X
    
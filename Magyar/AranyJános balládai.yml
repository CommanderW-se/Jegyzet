Tengerihántás:
  - Helyszín:
    - vidék/falu
  - Idő:
    - Este
  - Tevékenység:
    - Kukoricát hántanak
    - Valaki mesél egy történetet
  - Sztori:
    - Helyszin: Adony
    - idő: Nyár és Ősz
    - szereplő:
      - Dalos Eszti
      - Tuba Ferkó
      - Ők egymás szeretői
    - Történés: 
      - Feri elmegy a legerőlől a nyájával
      - Eszti bánatában szumorú lessz meghal 
      - Ferkó hazatér megtudja hogy meghalt az Eszti és mindn nap kijár a temetőbe
      - Ferkót képzelődik -> eszti hangja kisérti
      - Megőrül majd a toronyból lesik és meghal 
      - "itt nyugosznak fagyos földbe": Eszti terhes lett
      - Ezsti a bánatba a szégyenbe halt bele
      - Balladai homály: 
        - az hogy szeretők 
        - terhesség
        - Ferkó halála
  - Értelmezés:
    - Vannak motívumok a műben:
      - Beszédes nevek 
      - Tubának van furujája
      - Dalos szeret énekelni 
    - Bűn és abűnhődés:
      - Házaságon kívű kapcsolat
      - halála
      - erkölcsi vétek
Ágnesasszony:
  - szerkezet:
    - 1-4.versszak (Erső rész):
      - Ágnesaszzonymos és kérdezgetik
      - Kitudódik mit tett Ágnesasszony
      - A hajdu kideríti tettét
      - páróra
    - 1-19. vresszak (Második rész):
      - börtön bíróság
      - ítélethozatal
      - párnap
    - 20-26 versszak (Harmadik rész):
      - Ágnes asszony bűnhődése
      - évekig
  - Bűn:
    - Gyilkosságban való részvétel
  - Ítélet:
    - Szeretőt felakasztyák, Ágnesasszony életfogytiglan börtön 
  - Bűnhődés:
    - Felmentik az itélet alól mert nem beszámítható (Megőrült, saját bűntüdata roppantotta össze)
    - Deus ex machina
  - Értelmezés:
    - Arany vizsgálta az emberek lelki világát 
    - Ebben a konkrét balladában a megőrülés folyamatát vizsgálta:
      - Elősször bűntudat

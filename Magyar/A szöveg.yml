A szöveg:
    - tejes
    - lezárt
    - szándékolt üzent
    - logikailag és tartalmilag összefügő
    - szerkeztett
    - nem függ a terjedelemtől
    - szerkezete:
            makro:
                Cím:
                    figyelem felkeltő
                    a szöveggel kapcsolatos
                Bevezetés:
                    - téma ismertetés
                    - min egy bekezdés
                    - Fókus mondat:
                        szöveg tejes tartalmát foglalja össze
                Tárgyalás:
                    téma kifejtése
                    min két mondat
                Befejezés:
                    összefoglall
                    lezár
                    új dolgot nem mondhat
                    min egy bekezdés
            mikro:
                bekezdések:
                    Tételmondat:
                        Öszefoglalja a bekezdést 
Szöveg értelmét alakító tényezők:
    - szövegvilág:
        -Nelvi ismertetés
        -Valóság ismeret 

Mi kell a kommunikáciohóz:
    - Résztvevők: adó,vevő
    - beszédhejzet
    - Közös nyelv
    - Szövegfonetikai eszközök:
        - Hangsúly: Lényeg kiemelés
        - Hangerő: Figyelem felkeltő
        - Beszédtempó: Lassú/gyors
        - Hanglejtés: Kérdés/kijeelentés
        - Bezéd szünet: írásban vessző, levegővétel, hatásszünet
        - Hangszín: Mindenkinek egyedi
    - Test beszéd 
    - Szöveg vizuális képe: íráskép,írásjelek
    - Közös háttér ismeret
    - Tudáskeret: A világ egy meghatározott részére vonatkozó ismereteink halmaza
    - Forgatókönyv: tanult; meghatározza a cselekvéseink sorrendjét
    - közösségi érintkezési szabályok
Jelentés rétegek:
    Elsődleges: A szöveg szó szerinti jelentése
    Másodlagos: Moögötts jelentés jelentés

A szöveg jelentésbeli kapcsoló elemeit:
    Kohézió: a szöveg összefüggő és logikus # jelentésbeli szövegösszetartó erő
    Kétféle összetartozás van:
        - jelentésbeli:
            - Szavak jelntésének összefügései
            - pl.:
                - szóismétlések helyett:
                    rokonértelműszavak
                    körülírás
                - Mezőösszefügésben lévő szavak használata
                - Képzettársítás a szavak közt:
                    metafora
            - Jelentésbeli hiányt két mondat között ... is jelölhetik
            - mondatok logikai - tartalmi összefügései:
                - mellérendelő kötőszó:
                    Kötőszók Határozó szók és Módósítószó 
                - tagolás:
                    bekezdések
                    Mondatko szórendje
                    A régi infó(téma) és az új infó(réma) váltakozik.
        - nyelvtami:
            - A nyelvtani elemk is egymás utáni mondatokat kapcsolnak össze.
            - Vissza vagy leőre utalnak.
            - Szófajok:
                - Névelők  # Volt egyszer egy király. A királynak volt három fia.
                - Sorszámnevek  # Alz első helyezett Áron. Barna a másidik lett.
                - Névmások # Ott megy Máté. Tőle kaptam egy csokor virágot.
            - Utalás:
                - visszautalás # ... tamástól. Ő az öcsém.
                - előreutalás # Ezt akartad. Piros pulóvert ...
                - rámutatás # Azt kérem!
            - Toldalék:
                - A toldalékoknál a szám és a szemly egyeztettésre figyelünk.
                - birtokos személy jel. #A barátnőm megsértődött. Azt hiszi, én árultam el a titkát a többieknek.
 
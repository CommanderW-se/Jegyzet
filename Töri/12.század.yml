    Tatárjárás előtti időszak: # Rogerius Nagyváradi Kanonok : Siralmas ének Magyarorszák pusztulásárol
      - Politika:
         A főcélja a királyi hatalom tekintélyének a visszaálítása
      - Behívda az orszgába a kunokat azért hogy novelje a hadseregének légyszámát
      - A főurk székeit a tanácsban összetörette
      - András tanácsosait elűzte
      - ezen lépései ellenérzést váltottak ki a nemesektől
      - kunok betelepítése is viszályt okoztak
      - birtok viszavételezések
    Tatárjárás:
      - A mongol-tatárok felemelkedése:
          Temüdzsé nevezetű mongolhoz fűződik.
          Felveszi a dzingisz kán nevet.
          1240 Kiev bevétele
          Kublajkán
      - A tatárokról elősször juliánusz barát hoz hírt
      - Batukán egy levélben is felszólítja hogy hódoljon be 1238
      - a tatárjárás főbb eseményei:
        - 1241 tavaszán indulnak meg a tatárok
        - a kárpátok legtöbb hágón mennnek át
        - a fő erők a verecke hágóján támadnak
        - a fő ütközetre a muhi csatábna került sor április 11-dike:  # 139 oldal
          - A magyar király komoly erőket vonulatak fel 
          - A sajó folyó két oldalán sorakoztak fel
          - Atatárok körbevették a tábort és nyílzáport eresztettek rá
          - nem zárták őket tejjesen körül
        - Végül traú várában menekült a király 
        - a dunántúlt kisseb pusztítás éri
        - főleg az alföd szenvedetett károkat
        1242-tó nyarán kivonulnak a tatárok:
          Meghalt a nagy kán.
          

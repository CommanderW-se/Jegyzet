Szóképek:
  - név átvitel:
    - Hasonlat:
      - Két dolgot hasonlít össze valamilyen közös tulajdonság alapján
      - Hasonlító / Azonsító
      - Hasonlított / Azonsosított
      - közös jegy
      - A két sík külön megmarad
      - Gyakran van benne: mint, akár, mintha
      - Példa: Elváltak egymástól, mint ágtól a levél
    - Metafora:
      - Összevont hasonlat
      - Két dolgot azonosít egymással
      - Hasonlító / Azonsító
      - Hasonlított / Azonsosított
      - Külső vagy belső hasonlóság alapján jön létre
      - Képi sík + fogalmi sík
      - Teljes metafora:
        - Mindkét sík jelen van
        - Példa: A lelkem ódon, babonás vár
      - Csonka metafora:
        - Az egyik sík hiányzik
        - Példa: Gyere ki galambom, gyere ki gerlicém
      - pl.: bárányfelhő
    - Megszemélyesítés:
      - Élettelen dolgokat élőként mutat be
      - Emberi tulajdonságot vagy cselekvést ad tárgyaknak
      - Példa: A torony bámult rá
    - Szinesztézia:
      - Különböző érzékelési területeket kapcsol össze
      - Példa: Édes beszéd
      - Édes = ízlelés
      - Beszéd = hallás
    - Allegória:
      - Hosszabb, összetett költői kép
      - hasonlat/metafora amey az eghész művön végig vonul
      - Egy egész versszakon vagy művön végigvonulhat
      - Állandóbb jelentése van
      - Példa:
        - tenger = nép
    - Szimbólum:
      - Jelképes jelentésű költői kép
      - A jelentése nem mindig egyértelmű
      - Többféleképpen értelmezhető
      - Gyakran egy mélyebb gondolatot fejez ki
      - töblet jelentéssel jelentkezik
      - Példa: Ugar = Magyarország , tél = elmúlás/halál , hajó = életút

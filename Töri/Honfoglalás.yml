A magyarokat megtámadták a Besenyőket:
    - ezért elfoglalták a Kárpátmedence tiszán túli részét

Honfglalást vezette:
    - Árpád

Kárpátmedence etnikai hejzete:
    - Etnikai viszonyok:
        Bolgárok
        Avarok
        Szlávok
        Morvák
        Keleti frankok népei (Németek)
    - Államok:
        Nagy morva birodalom
        Keleti frankok
        Avarok szövetsége

Honfoglaláés szakaszai:
    - első szakasz(900 évek elejéig tart):
        tiszántúl elfoglalása
        Erőgyűtés időszaka
    - második szakasz(905-től):
        Dunai terrületek elfoglalása (fehérló mondálya) 
        Az egész kárpát medence feletti urlom megerdősítésében döntő szerepe volta a 907-es Pozsonyi csatának.


Ledelepedés:
    - Törzsenként telepedtek le 
    - És törzsenkénti álamokat hoztak létre

    
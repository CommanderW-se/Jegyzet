- Miben tér ell a magyar a többi (Európai) nyelvtől?:
  - Hangtani szempont: mgh illeszkedés (Ritka)
  - Mondatani szempont: tagolás, szórend
  - Alaktani szempont: agglutináló nyelv (Ragaztó nyelv[Toldalékoló])
- Tipusok:
  - Aglutináló:
    - Olasz
    - Taloissani (Házainban) = tal (ház) + i (Többeszám jele) + ssa (-ban) + ni (bitokos szeméyrag)
  - felektáló (Egy betű több nyelvtani dolgot jelöl):
    - Spanyol
    - cant (énekelek) = igealakok -o ragja: kifejezi a kijelentő módot, jelen idő, egyes szám első személyt is.
  - Izoláló (Elszigetelő [Szét választja a toldalékot]):
    - Angol
    - Someone broke into their house at night.
- Aglutináló nyelvek:
  - Több morfémából(szóelem) álnak
  - A tő előtt és vagy után toldalékok vannak
  - pl.: finn, japán, koreai
- Izoláló nyelvek:
  - 1 morféma képzi a szót
  - A nyelvtani ciszonyokat nem a toldalékok, hanem a szórend határotta meg
  - pl.: angol, kínai
- Felktáló nyelvek:
  - Egy toldalék egyszerre több mindent jelent het
  - Egybeolvad a szótővel
  - pl.: latin, Spanyol

- Nincsen tiszta Tipusok
- Az alapján osztják be hogy mi az erősebb/gyakoribb

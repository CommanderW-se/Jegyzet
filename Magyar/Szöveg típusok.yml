Közvetítő közeg:
    - Szóbeli:
        - hangok + nonverbális kommunikációs eszközök
        - közvetlen kommunikáció azonalli visszajelzés
        - sopontán vagy tervezett
    - írásbeli:
        nyelvi jelek + vizuális kommunikációs eszköz 
        központozás
        közvettet(nincs azonalli visszajelzés)
        tervezzet
    - digitális:
        - pl:
            chat
            SMS
            Komment
        - átmenet a szóbeliség és az írásbeliség között
        - Írásjelek, emotikonok, csupanagybetű
        - Írott szöveg mégse tervezzet
        - Hasonnlít a szóbeli kommunikációra

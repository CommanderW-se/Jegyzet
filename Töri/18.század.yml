  - Rendeletei:
    - 1754 Vám rendelet:
      - Kettős vámhatárt húzott meg:
        - Egy vámhatár a birodalom határain amivel meg akarta állítani a moderneb külső termékeke beáramlását
        - A belső vámhatár a birodalmon belüli kereskedelmet szabályozza 
        - Oka: Jelentőseb bevételekere akart szert tenni
      - 1767 Úrbéri rendelet (Urbárium):
        - A jobbágy földesúri viszonyt szabályozza
        - Megszabja hogy a jobbágyoknak milyen adó kötelezetségei vannak a földes urakkal szemben
        - Rögzítete a robot menyiség
        - Mágállította a majorsági területek növelését
        - Szabályozták az irtvány földek táni adókat a földesúr felé 
        - Nem hagyta hogy a földesúr kizsákméányolja az állam kárára a jobbágyokat
        - Okai: 
          - A földesurak növelték majorsági területüket a jobágy telkek rovására
          - Nem akarta hogy a földesurak adóikkal leterheljék a jobbágyokat mert akkor nem tudnak állami adókat fizetni
          - Majorsági robotoltató gazdaság

Az ember tragédia elemzés:
  - Műfaj: 
    - emberiségköltemény (drámaiköltemény)
    - Műnema Dráma nem műfaj
  - Téma: Mi a történelem
  - források:
    - Biblia
    - Darvin fajelmélete
    - Gothe faust
    - Dante Isteni Szinjáték
    - Felvilágosodás korabeli filozofusok
    - Hegel filozófijáját:
      - "Világ szellem"
      - Hegel dialektikája:
        - jelentés:
          - Vita vagy érvelés
          - Megismerési módszer
        - Világszellem (Korszellem/Eszme)
        - A történelmet vagy világot egy egy eszme irányítya
        - Nem Isten irányítya a világot
        - A történelemben nincs rendszere és célja
        - Az ember fejlődik
        - Hegeli triáda:
          - tézis (Állítás)
          - antitézis (Ellenállítás)
          - szintézis:
            - Egybefoglalja az előző kettőt
            - Ez lessz az ujj tézis
          - konklúzió: 
            - Körforgás lessz a vége
  - Madách elmélete:
    - Az eszmék is fejlődnek
    - A közöség hozza létre az eszméket, ezér az eszme közös, de az emberiség egyénekből áll
    - Az emberiségnek 100,000 éve van összesen mert a nap ki fog hüln
  - hármas egység: 
    - nem tejjesül

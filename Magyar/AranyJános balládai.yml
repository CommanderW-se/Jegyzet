Szondi Két apródja:
  - Történelmi előzmény:
    -  Drégely várának eleste (1552)
    - Tinódi Lantos Sebestyén: "Budai Ali basa históriája (1553)"
    - Drégely várának kapitánya: Szondi György
  - Szerkezet:
    - 1. rész (1-2. versszak):
      - Alaphelyzet / kiindulópont
      - Szituáció:
        - Drégely vára elesett, Szondi György meghalt.
        - A két apród a sírjánál gyászol.
        - Ali és serege a győzelmet ünnepli.
      - Helyszín:
        - Drégely várának romjai
        - Szondi sírja a hegytetőn
        - A török tábor a völgyben
      - Idősík:
        - Jelen, a vár eleste utáni este
      - Szereplők:
        - Két apród
        - Ali és serege
      - Téma:
        - Tisztelet, Hűség, Hazaszeretet, Önfeláldozás

    - 2. rész (3-4. versszak):
      - Szituáció:
        - Ali hiányolja a két apródot a győzelmi ünnepségről.
        - Megtudja, hogy Szondi sírjánál énekelnek.
        - Megjelenik Márton Pap akit afiúk után küldenek
        - Márton hazáruló
        - ő próbálja lehívni az apródokat
      - Helyszín:
        - Török tábor
        - Szondi sírja
      - Idősík:
        - Jelen
      - Szereplők:
        - Ali
        - Márton pap küldött
        - Két apród

    - 3. rész (5. versszaktól a páratlan versszakok):
      - Szituáció:
        - A két apród Szondi hősiességét és halálát énekli meg.
        - gyászéneket mondanak
      - Történés:
        - Ali megadásra szólítja fel Szondit Márton pap közvetítésével.
        - Szondi visszautasítja a kegyelmet.
        - A törökök ágyúkkal ostromolják a várat.
        - Szondi elpusztíttatja értékeit és megöli lovait, hogy ne kerüljenek az ellenség kezére.
        - A két apródot megmenti a haláltól.
        - Szondi hősiesen harcol, végül elesik.
        - Az apródok megátkozzák Szondi gyilkosát.
      - Helyszín:
        - Drégely vára a visszaemlékezésben
        - Szondi sírja a jelenben
      - Idősík:
        - Múlt, visszaemlékezés a vár ostromára
      - Szereplők:
        - Két apród
        - Szondi György
        - Ali és katonái
        - Márton pap

    - 4. rész (6. versszaktól a páros versszakok):
      - Szituáció:
        - A Márton megpróbálja rávenni az apródokat, hogy menjenek le Ali táborába.
        - Ő párbeszédet fojtatna de nem tudo
      - Történés:
        - A küldött gazdagságot és kényelmet ígér.
        - Ételekkel, italokkal és biztonsággal csábítja őket.
        - Arra hivatkozik, hogy hálával tartoznak Alinak.
        - Megpróbálja lezárni Szondi történetét.
        - Végül fenyegetéssel próbálja megtörni az apródokat.
        - Az apródok nem engedelmeskednek, tovább éneklik Szondi történetét.
      - Helyszín:
        - Szondi sírja a hegytetőn
      - Idősík:
        - Jelen
      - Szereplők:
        - Két apród
        - Török küldött

    - A párbeszéd jellege:
      - Látszólagos párbeszéd, valójában párhuzamos monológok.
      - A török küldött az apródokhoz beszél, de ők nem válaszolnak neki közvetlenül.
      - Az apródok folyamatosan Szondi hőstetteit éneklik.
      - A két fél elbeszél egymás mellett.
      - Két értékrend ütközik: hűség és becsület, illetve hatalom és gazdagság.
      - A balladat tipusa: 
        - több szólamú ballada:
          - narátor 1-2.vsz.
          - párbeszéd 3.vsz.-től 

    - Hogyan próbálja a küldött lehívni az apródokat:
      - Csábítással:
        - Finom ételeket, italokat és gazdagságot ígér.
      - Kényelemmel:
        - Biztonságos szállást és gondoskodást ajánl.
      - Érzelmi ráhatással:
        - Arra hivatkozik, hogy Ali tisztességgel eltemette Szondit.
      - Hálára hivatkozással:
        - Azt állítja, hogy az apródok hálával tartoznak Alinak.
      - Sérteget:
        - Főképp szondi györgyöt
      - Sürgetéssel:
        - Figyelmezteti őket a közelgő hideg éjszakára.
      - Fenyegetéssel:
        - Ali haragjával, börtönnel és veréssel fenyegeti őket.
      - Megjegyzés:
        - A jelenben a török küldött beszél az apródokhoz, nem Márton pap.
        - Márton pap Szondi történetében, a múltban közvetíti Ali üzenetét.
        
    - Idősíkok:
      - Két idősík jelenik meg:
        - Múlt:
          - Apródok vannak fenn a várnál
        - Jelen:
          - Mártonpapa és török tábor lennt a völgyben

    - A mű lezárása:
      - Az utolsó versszak egy átok.
      - Az apródok megátkozzák Szondi gyilkosát.
      - Istent kérik, hogy ne könyörüljön a gyilkoson.
      - Az átok bibliai eredetű.
      - A lezárás az apródok rendíthetetlen hűségét és Szondi iránti tiszteletét mutatja.
      - Az apródoké az utolsó szó 
  - Értelezés:
    - Az apródok döntési helyzetbe kerülnek:
      - Megtagadják a magyarságukat és átálnak
      - Vagy ellenálnak és meghalnak
    - Válaszuk a hűség és a Hazaszeretet
    - Irodalmi áthajlás:
      - Arany hitvallása:
        - A költő feladata, hősökről és tetteikről beszélni
      - A műben a költők a dalnokok

Katona énekek:
    - Katona élet
    - Hös végvári vitézek dicséretett
    - Balassi személyes tapasztalatait mutatja be 
    - vitézs != katona
    - katoma:
        hivatásos fizetséget kap
        hadsereg része 
    - Vitéz:
        önkéntes
        zsoldot kap
        kisebb csoportokba gyűlnek össze
        fosztogtank, ha nincs pénz
    
    - Balassi is vitézvolt
    - Várkapitány volt
    - A vitézi erényeket hangsújaz ki a vereseiben

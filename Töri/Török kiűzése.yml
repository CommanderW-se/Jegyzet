Török kiűzése és a török kor mérlege:
    Forrás:
        - "Történelem 10. tankönyv: A török kiűzése és a török kor mérlege rész alapján. :contentReference[oaicite:0]{index=0}"

    Előzmények:
        - II. Rákóczi György engedély nélkül indított hadjáratot Lengyelország ellen
        - A hadjárat kudarccal végződött
        - A török ezt megtorolta Erdély ellen
        - Várad 1660-ban török kézre került
        - Erdély meggyengült
        - I. Lipót Habsburg uralkodót lekötötték a francia háborúk
        - A magyar főurak törökellenes háborút szerettek volna
        - Zrínyi Miklós felismerte hogy a török meggyengült
        - Zrínyi szerint eljött az idő a török kiűzésére

    Zrínyi Miklós:
        - Horvát bán volt
        - Katolikus főnemes volt
        - A szigetvári hős Zrínyi Miklós dédunokája volt
        - Hadi író és költő is volt
        - Fontos műve a Szigeti veszedelem
        - Fontos műve Az török áfium ellen való orvosság
        - Nemzeti hadsereget akart
        - Úgy gondolta hogy a magyar rendeknek is részt kell venniük a török elleni harcban
        - 1664-ben téli hadjáratot vezetett
        - Felégette az eszéki hidat
        - Az eszéki híd fontos volt a török utánpótlás miatt

    Szentgotthárd és vasvári béke:
        - 1664-ben a törökök Bécs ellen indultak
        - A császári sereg Szentgotthárdnál legyőzte a törököket
        - A győzelem megmutatta hogy a török hadsereg már elmarad a nyugati hadseregektől
        - I. Lipót mégis békét kötött a törökkel
        - A békét Vasváron kötötték meg 1664-ben
        - A vasvári béke török kézen hagyta az újonnan elfoglalt területeket
        - Ez nagyon felháborította a magyar nemességet
        - 1664 őszén Zrínyi Miklós vadászbalesetben meghalt
        - Halálát sokan gyanúsnak tartották
        - A magyar rendek elvesztették fontos vezetőjüket

    Rendi összeesküvés:
        - A vasvári béke miatt magyar főurak szervezkedni kezdtek
        - Wesselényi Ferenc nádor is részt vett benne
        - Később Zrínyi Péter folytatta a szervezkedést
        - Nádasdy Ferenc is részt vett benne
        - Frangepán Ferenc is részt vett benne
        - I. Rákóczi Ferenc is részt vett benne
        - A szervezkedés a Habsburgok ellen irányult
        - Lipót végül elfogatta az összeesküvőket
        - 1671-ben Zrínyi Pétert, Nádasdy Ferencet és Frangepán Ferencet kivégezték
        - I. Rákóczi Ferenc életét anyja pénzzel mentette meg

    Abszolutista kísérlet:
        - Lipót felfüggesztette a magyar alkotmányt
        - Nem nevezett ki új nádort
        - Elbocsátotta a magyar végvári katonákat
        - Az adókat többszörösére emelte
        - A protestánsok ellen is fellépett
        - Ez sok magyar társadalmi csoportot az udvar ellen fordított
        - A Habsburgokhoz hű nemeseket labancoknak nevezték
        - Az udvarral szemben álló bujdosókat kurucoknak nevezték
        - A kurucok főleg a Partium területén gyülekeztek
        - Thököly Imre 1678-ban a kurucok élére állt
        - Lipót 1681-ben Sopronban országgyűlést hívott össze
        - Visszaállították a rendi alkotmányt
        - Nádort választottak
        - Korlátozottan engedélyezték a protestáns vallásgyakorlatot

    Bécs ostroma:
        - A törökök Thököly sikereit Habsburg gyengeségnek hitték
        - 1683-ban a török sereg Bécs ellen indult
        - I. Lipót elhagyta Bécset
        - Bécset körülbelül 20000 katona védte
        - Lipót segítséget kért
        - Sobieski János lengyel király segített
        - Német uralkodók is küldtek segítséget
        - Lotharingiai Károly császári serege is részt vett a felszabadításban
        - A felmentő sereg az utolsó pillanatban érkezett
        - A keresztény seregek legyőzték a török ostromlókat
        - Ezután Párkánynál is legyőzték a törököt
        - Esztergom várát is visszafoglalták

    Szent Liga:
        - A győzelmek nagy lelkesedést váltottak ki Európában
        - I. Lipót eleinte még békét akart
        - XI. Ince pápa pénzügyi támogatást ígért
        - A pápa rávette XIV. Lajost a fegyverszünetre
        - Így Lipót folytatta a török elleni háborút
        - 1684-ben létrejött a Szent Liga
        - A Szent Ligában részt vett a Habsburg Birodalom
        - Részt vett Lengyelország
        - Részt vett Velence
        - A cél a török kiűzése volt

    Magyarok helyzete a háború elején:
        - A háború elején sok magyar még a török oldalán állt
        - Thököly nem ismerte fel hogy most a török kiűzése a cél
        - Thököly visszautasította az udvar tárgyalási kísérletét
        - A törökök 1685-ben Váradon elfogták Thökölyt
        - A törökök ki akarták szolgáltatni őt a császárnak
        - Ez nem sikerült
        - A kurucok nagy része Thököly elfogása után a császári sereghez csatlakozott
        - A magyarok nem egységes szervezett erőként csatlakoztak
        - Ez politikailag kedvezőtlen volt

    Buda visszafoglalása:
        - A döntő fordulat Buda visszafoglalása volt
        - Buda 1686-ban szabadult fel
        - A várat két hónapos véres ostrom után foglalták el
        - A támadók között voltak császári csapatok
        - Voltak bajor csapatok
        - Voltak brandenburgi csapatok
        - Magyar csapatok is részt vettek az ostromban
        - A hadvezérek között fontos volt Miksa Emánuel
        - Fontos volt Lotharingiai Károly
        - A budai pasa Abdurrahman volt
        - Abdurrahman hősiesen védte Budát

    A háború további menete:
        - Buda után a keresztény seregek gyorsan haladtak előre
        - 1687-ben Nagyharsánynál legyőzték a török főerőket
        - A csata a mohácsi sík közelében történt
        - 1688-ban Miksa Emánuel bevette Belgrádot
        - 1689-ben a császári seregek már Niš környékén jártak
        - Úgy tűnt hogy a törököt akár Európából is kiűzhetik
        - A legfontosabb hadvezérek közé tartozott Miksa Emánuel
        - Fontos hadvezér volt Lotharingiai Károly
        - Fontos hadvezér volt Savoyai Jenő

    Francia támadás:
        - XIV. Lajos félt a Habsburgok erősödésétől
        - Megszegte ígéretét
        - Hátba támadta a Habsburg Birodalmat
        - A Habsburgoknak nyugatra is katonákat kellett küldeniük
        - Ez lehetőséget adott a török ellentámadásra
        - A háború még körülbelül egy évtizedig folyt Magyarországon
        - A hosszú háború sok szenvedést okozott
        - A katonák gyakran kirabolták a lakosságot
        - Sok ember meghalt vagy éhezett
        - Az ország erősen pusztult

    Zenta és karlócai béke:
        - A Habsburg Birodalom bírta a kétfrontos háborút
        - Savoyai Jenő 1697-ben Zentánál döntő győzelmet aratott
        - A török főerők súlyos vereséget szenvedtek
        - Az Oszmán Birodalom erőforrásai kimerültek
        - A török békét kért
        - A Habsburg Birodalom erőforrásai is kimerültek
        - 1699-ben megkötötték a karlócai békét
        - Magyarország a Temesköz kivételével felszabadult
        - Erdély is Habsburg fennhatóság alá került
        - A török uralom Magyarország nagy részén véget ért

    A török kor mérlege:
        - A török kor közel két évszázadig tartott
        - Sok háború pusztította az országot
        - Sok embert megöltek
        - Sok embert rabságba hurcoltak
        - Járványok és éhínségek is pusztítottak
        - A lakosság a Mátyás-kori 3,5-4 millióról néhány százezerrel csökkent
        - Ez azért is nagy veszteség mert Európa népessége közben nőtt
        - A legnagyobb pusztulás a nagy hadjáratok idején történt
        - Súlyos károkat okozott a tizenöt éves háború
        - Súlyos károkat okoztak az Erdély körüli harcok
        - Súlyos károkat okozott a felszabadító háború
        - Leginkább a hadak útjába eső területek pusztultak
        - A Duna mente különösen sokat szenvedett
        - Az alföldi területek is sokat szenvedtek
        - A magyar lakosság vesztesége különösen nagy volt
        - A hegyvidéki népek kevésbé pusztultak
        - Erdélybe románok vándoroltak be
        - A Délvidékre szerbek érkeztek
        - A magyarság aránya csökkent
        - Az etnikai határok megváltoztak

    Települések és gazdaság:
        - Sok település elpusztult
        - A végvári vonalon sok városból katonai erőd lett
        - Esztergom, Buda és Veszprém is végvári szerepet kapott
        - Templomokat néha katonai célra használtak
        - A török dúlta területeken eltűnt az aprófalvas szerkezet
        - A Délvidéken sok régi település nyomtalanul eltűnt
        - Az Alföldön a lakosság nagyobb mezővárosokba költözött
        - Ilyen mezőváros volt Szeged
        - Ilyen mezőváros volt Kecskemét
        - Ilyen mezőváros volt Debrecen
        - A nagyobb mezővárosok több védelmet adtak
        - Sok szántóföldből legelő lett
        - Sok helyen ingovány vagy futóhomok jelent meg
        - Az Alföld maradék erdőségeit is pusztították a hadak

    Lényeg röviden:
        - A török kiűzése hosszú háborúval történt
        - A fordulópont Buda 1686-os visszafoglalása volt
        - A végső döntő győzelem Zenta volt 1697-ben
        - A karlócai béke 1699-ben zárta le a háborút
        - Magyarország nagy része felszabadult
        - A felszabadulás után az ország Habsburg fennhatóság alá került
        - A török kor után Magyarország népessége, településhálózata és etnikai aránya erősen megváltozott
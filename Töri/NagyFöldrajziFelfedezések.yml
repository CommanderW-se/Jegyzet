Okia:
  - a 15. század végére Európa kikerült abből a válságból (amely a 14. században sújtotta), és újra növekedésnek indult a népesség
  - arany éhség: az európai országok gazdasági fejlődése és a kereskedelem fellendülése miatt megnőtt az arany iránti kereslet
  - a török elfoglaja Levantét, nem gátolyja a kereskedelmet, de megnöveli a vámokat 
Tényezők:
  - hatodik oldal négyes ábra (TK)
  - Portugál állam megerősödése 
Nagy földrajzi felfedezések:
Időszak:
- "15–16. század"
Fogalma:
- "Az európai államok (főleg Portugália és Spanyolország) tengeri felfedező útjai, amelyek új kereskedelmi útvonalakat nyitottak, új földrészeket tártak fel, és elindították a gyarmatosítást."
Okai:
Gazdasági okok:
- "Fűszerek (bors, fahéj, szegfűszeg) és luxuscikkek iránti nagy kereslet Európában"
- "Arany- és ezüsthiány: nemesfémre volt szükség a pénzgazdálkodáshoz"
- "Közvetítők kiiktatása: az arab és itáliai kereskedők drágán adták a keleti árukat"
- "Új piacok és nyersanyagok keresése (később cukor, dohány, gyapot)"
Politikai okok:
- "Spanyolország és Portugália versengése a tengeri utakért és területekért"
- "Erősödő királyi hatalom: az uralkodók képesek voltak drága expedíciókat finanszírozni"
- "Presztízs és hatalmi terjeszkedés: minél több terület → annál nagyobb befolyás"
Vallási okok:
- "A kereszténység terjesztése (missziók, térítés)"
- "A muszlim világgal szembeni küzdelem folytatása (Reconquista után is)"
- "Legenda a 'János pap országa' (keresztény szövetséges keresése Afrikában/Ázsiában)"
Technikai okok:
- "Karavella és karakk: gyorsabb, nagyobb teherbírású hajók"
- "Iránytű és asztrolábium: pontosabb tájékozódás"
- "Portolán térképek és hajózási ismeretek fejlődése"
- "Háromszögvitorla: széllel szemben is lehetett haladni"
- "Tengeri ágyúk: hajók védelme és erőfölény"
Történelmi kiváltó okok:
- "1453: Konstantinápoly elfoglalása (Oszmán Birodalom) → a szárazföldi keleti kereskedelem nehezebb és drágább"
- "Reconquista lezárása (1492) → Spanyolország figyelme a tengerek felé fordul"
- "Európa fokozatos kilábalása a középkori válságokból → növekvő kereskedelem és tőke"
Előzmények:
- "Középkori keleti kereskedelem: selyemút, levantei kikötők, velencei és genovai közvetítők"
- "Portugál felfedezések Afrika partjai mentén (lépésről lépésre haladás)"
- "Tengerésziskola és szervezett kutatás (Henrik herceg támogatása Portugáliában)"
- "Új földrajzi elképzelések: a Föld gömbölyű, nyugat felé elérhető Ázsia (téves távolságbecsléssel)"
Fontos újítások a hajózásban:
- "Karavella: könnyű, gyors, felfedező utakra ideális"
- "Karakk (nagy óceánjáró): sok áru és fegyver szállítása"
- "Háromszögvitorla + kormánylapát: jobb manőverezés"
- "Iránytű: állandó iránytartás nyílt tengeren"
- "Asztrolábium/kvadráns: szélesség meghatározása csillagok alapján"
- "Portolán térképek: partvonalak, kikötők, szélirányok jelölése"
- "Tengeri ágyúk: katonai fölény biztosítása a kereskedelmi útvonalakon"
Főbb felfedezők és útjaik:
Kolumbusz Kristóf:
- "1492: nyugati irányban indul Spanyolországból (Santa María, Pinta, Niña) → eléri a Karib-térséget"
- "Miért indult el: rövidebb tengeri útvonalat akart Indiába, hogy fűszerekhez jusson (közvetítők nélkül)"
- "Mit talált: Amerika (Karib-szigetek), de ő azt hitte, Indiába érkezett"
- "Jelentősége: megnyitotta Európa számára Amerika felfedezését → gyarmatosítás és világgazdaság kezdete"
Bartolomeu Dias:
- "1488: eléri Afrika déli csúcsát (Jóreménység foka)"
- "Jelentősége: bebizonyította, hogy Afrika megkerülhető → megnyílt az út India felé"
Vasco da Gama:
- "1497-1499: Afrika megkerülésével eljut Indiába (Kalikut)"
- "Jelentősége: létrejött a tengeri fűszerút → Portugália kereskedelmi nagyhatalom lett"
Amerigo Vespucci:
- "1499-1502: Dél-Amerika partvidékének feltárása több út során"
- "Jelentősége: felismerte, hogy Kolumbusz nem Ázsiát, hanem egy új földrészt talált → innen az 'Amerika' név"
Magellán expedíció:
- "1519-1522: első Föld körüli hajóút (Magellán elindul, de útközben meghal; Elcano fejezi be)"
- "Jelentősége: bizonyította a Föld gömbölyűségét és a világtenger egységét, felmérhetővé váltak a valódi távolságok"
Hernán Cortés:
- "1519-1521: az azték birodalom meghódítása (Tenochtitlán elfoglalása)"
- "Jelentősége: Spanyolország óriási aranyhoz/ezüsthöz jutott, létrejött Új-Spanyolország (Mexikó)"
Francisco Pizarro:
- "1532-1533: az inka birodalom meghódítása (Atahualpa elfogása)"
- "Jelentősége: Spanyolok hatalmas nemesfémkincshez jutottak, Peru spanyol uralom alá került"
Fontos események időrendben:
1488:
- "Bartolomeu Dias eléri a Jóreménység fokát → Afrika megkerülhető"
1492:
- "Kolumbusz eléri Amerikát → új földrész bekapcsolódik Európa gazdaságába"
- "Granada elfoglalása → Reconquista vége, Spanyolország megerősödik"
1494:
- "Tordesillasi szerződés: a pápa közvetítésével Spanyolország és Portugália felosztja az újonnan felfedezett területeket (választóvonal)"
1497:
- "Vasco da Gama elindul India felé → tengeri fűszerút kiépítése"
1519:
- "Magellán expedíció elindul → cél: nyugati út Ázsiába"
- "Cortés megkezdi az azték birodalom meghódítását"
1522:
- "Az első Föld körüli hajóút befejezése → világtenger egységének bizonyítása"

Károly Róbert uralkodása: #I Károly
  uralkodott: 1308-1342
  1301: Kihal az árpádház # III András
  1301-1308: Interregnum # kiráj talan kor, három kiráj jelölt
  Anjou házi uralkodók: 
    - Nápoly urai, Pápa Hűbéresei
    - Címerjelképük a liliom
  ez az időszaka a tartományúri hatalom jellemző:
    főbb jelemzői:
      Egyes országrészeket uralják
      Királyi felségjogokot gyakorol
      Hatalmuk alapja a nagyszámu familiárisok
    A tartományúri hatalom felszámolása:
      első jelentős győzelem rozgonyi csata
      töb mint egy év tizedig tartó küzdelem
      vége Csák Máté legyőzése
    szent korona magyar államiság jelképe:
Károj Róbert gazdaságpolitikálya-Reformok:
  - Károly Róbert a gazdaságpolitikályában a regálé jövedelmekre támaszkodott
  - intészkedései:
      - bánya reform 147.oldal tk :
          A földbirtokosok akiknek a földjén arany és ezüst lelőhejeket találtak, megtarthatták birtokaikat
          megkapták a bányászok által a királynak fizetendő urbura(bánya pénz) egyharmadát
      - Nemesérc monopólium:
          A bányászoknak kibányászot nemesfémet bekellet váltani a nemzeti kincstárban
      - Értékállo aranyfornit veretése:
          - Arany forint #148 tk 10 ábra
          - A firenzei fiorínó mintályára vereti innen ered a forint kifejezés
          - váltópénzként ezüst dénárokat és forintot
          - mivel az aranyforint értéke stabil volt ezért a király elesett a kamara haszon jövedelmétől
          - Bevezette a kapuadót
          - harmincadvámot:
              - külföldről behozott áruk után szedett vám
              - a kereskedelem fellendülését eredményezte
              - Nyugat felé irányította a magyar kereskedelmetű
              - főkép vegyverekre és luxus cikkekre
          - országot 10 kamarára osztotta
          - vezetője tárnokmester
          - kamara ispánya szedte be a regálé jövedelmeket
          - egyéb jövedelmeket is beszedte
          - pl: királyi birtokok jövedelmeit, pápának fizetendő tizedet
  - következményei:
      - királyi jövedelmek megnőttek
      - erős központi hatalom
      - gazdasági fejlődés
      - külkereskedelem fellendülése
      - pénzforgalom élénkülése
      - városok fejlődése
      - város tipusaik:
          - szabad királyi városok
          - mezővárosok
          - bányavárosok
egyéb fontos dolgok:
  - átalakítja a hadsereget:
    - megalapítya a bandériális hadsereget
  - átalakul az előkelő réteg:
    - kialakul a bárói réteg
    - főnemesség
    - köznemesség
    - honor birtok (Tistségekért járó földbirtok)
    - bánok (Déli határ menti vármegyék vezetői)
külpolitika:
  - 1335 visegrádi királytalálkozó:
      - Károly Róbert
      - III. Kázmér lengyel király
      - Luxemburgi János cseh király
      - célja a Habsburgok befolyásának visszaszorítása Közép-Európában
      - megállapodtak abban, hogy egymás között rendezik a trónöröklési kérdéseket
  - célja a magyar királyság területének növelése
  - elnyeri lengyel királyi címet
  - megszerzi a horvát és szlavón királyi címet
  - megszerzi a szerb királyi címet
  - beavatkozik a cseh trónharcokba
  - megkísérli megszerezni a bajor hercegséget


Nagy Lajos:
  lengyel magyar perszonálunió:
    - 1370-1382
    - 1370-ben örökli a lengyel trónt
    - egyesíti a két országot
    - közös külpolitika
    - külön kormányzat
    - külön törvényhozás
    - külön hadsereg
  uralkodása: 1342-1382
  belpolitika:
    - gazdaságpolitikája:
        - folytatja Károly Róbert gazdaságpolitikáját
        - tovább növeli a királyi jövedelmeket
        - bevezeti a kilencedet
    - társadalompolitikája:
        - 1351-es törvények:
            - megerősíti a nemesség jogait
            - megtiltja a nemesek földjeinek eladósítását 
            - megtiltja a jobbágyok szabad költözését
            - megakadályozza a jobbágyok földjének összevonását
            - megtiltja a jobbágyok földjének elzálogosítását
            - megőrzi a jobbágyok községi önkormányzatát
            - kilencedet vezeti be
    - hadserege:
        - folytatja a bandériumok rendszerét
        - megerősíti a királyi várak védelmét
  külpolitika:
    - terjeszkedő politikát folytat:
        - megszerzi a nápolyi királyi címet
        - megszerzi a dalmát városokat
        - megszerzi a balkáni területeket
    - harc a törökök ellen:
        - 1370-es években megállítja a török előretörést
        - 1382-ben meghódítja Bulgáriát
  egyéb fontos dolgok:
    - kultúra:
        - virágzik a középkori magyar kultúra
        - építészeti stílus: gótika
        - irodalom: lovagi epika, vallásos irodalom
    - egyház:
        - erősíti a pápai kapcsolatokat
        - támogatja a kolostorokat és egyházi iskolákat
    - városok:
        - tovább fejlődnek a városok
        - új városok alapítása
        - kereskedelem fellendülése 
    - társadalom:
        - nemesség megerősödése
        - jobbágyság helyzetének rögzítése 
    - hadsereg:
        - bandériumok rendszerének megerősítése
    - gazdaság:
        - királyi jövedelmek növelése   
        - kilenced bevezetése

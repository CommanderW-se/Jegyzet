    Egyik legfontosabb irata: 
      A jövedelem jegyzék:
        Domaniális jövedelmek: A királyt mint földbirtokost megillető jövedelmek
        Regálé Jövedelem: 
          A királyt mint uralkodód megillető jövedelem: #Királyi felségjog alapján szeddett
            Só adó
            legfontossabb a pénzbeváltásból eredő haszon #kamara haszna (Lucrum kamarae)
    Az első király aki egy egész vármegyéd ad oda:
      innenkez kezdődnek el a királyi birtok adományozások
  Második andrás:
    - uralkodott: 1205 - 1235
    - II andrás belpolitikáját úgynevezett "Újj berendeszkedés"
    - Lényege a birtok eladományozás
    - arnybulla: 1222
    - uralkodásanak a végén:
        1232-ben a zal folyón túl élő nemesek azt kérték hogy maguk közül szolgabírákat vállszthassanak
        Hogy ők döntsenek a szerviensek és nagybirtomkosok közötti perekben
        ez less az első lépés arra hogy a királyi vármegyét felváltja a nmesi vármegye
  Negyedik Béla: # 1235-1270

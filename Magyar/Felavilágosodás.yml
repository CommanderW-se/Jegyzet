        - John Locke # empírista filozófus
        - Isaac Newton # népszerűsítette munkásságát
        - Jhonathan Swift
    - felvilágosodás legnagyobb alakja
    - mindenhol üldözik művei imatt ezért elvonul:
        - egy birtokban svájc,németország, franciaország határán
    - igazi neve: Francois Marie Arouet
    - szatirikus költő, író, filozófus
    - 84-éves korábna visszamegy párizsba ahol ünneplik
    - művei:
        - Candide avagy a boldogság keresése
        - Filozófiai levelek
    - eszméi:
        - vallási türelem
        - szólásszabadság
        - egyház és állam szétválasztása
        - abszolutizmus ellenes
        - ráció és tudomány híve
  tézis regény:

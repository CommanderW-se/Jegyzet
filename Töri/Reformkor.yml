1830-1848:
  1830:
  - Azért a reform kor kezdete mert megjelent a hitel ami vázolya a reform ko főbb problémályit
  - A reform ujjítást jelent (Nem reformáció[Vallás ujítási mozgalom = reformáció])
  - A reformkorban fogalmazódnak azok az eszmék és jönnek létre azok a politikai mozgalmak amelyek Magyarország megújításást modernizálást akarják
  - Ez az időszak a polgárosodás kora Magyarországon (Feudális -> Polgári)
Eszmélyi:
  - Liberalizmus
  - Nacionalizmjs
  - Ezek összekapcsolódnak
  - Beszélhetünk Nemzeti szabadelvűséget
  - Nemzet teremtő ezsme a Nacionalizmus
  - Emberi alapjogok
Kultúrális vetület:
  - Magyar oktatás
  - Magyar Újságok
Kialakulásának okai:
  - Gazdasági okok:
    - 1800-1815-ig: 
      - Konyungtúrális(Gazdasági növekedés) időszak Magyarországon
      - Magyarország Agrár ország
      - Napóleoni háborúk alat nagy szükség volt az élelemre emiatt a magyar emberek akik a termelésben részt vettek elkeztek meggazdagodni
      - Ekkor épültek a Nemesi kasztellók töbsége Magyarországon
      - Napóleon Bécs elfoglalása után Kiáltván ad a Magyaroknak miszerint válasszanak saját királyt
    - 1815-30 ig:
      - Dekonnyungtúra időszaka
      - Birtokosok közül nagyon sokan rályönnek hogy a majorsági robotoltató gazdálkodás nem hatékony
      - Bérmunkásokat kéne alkalmazni
      - A földbirtokosoknak nemeseknek nincs elég tőkélye a moderniáláshoz
  - Külpolitikai okok:
    - 1830-ban kirobban Párizsban egy ujjab forradalom
    - Kolera felkelés a környező háborúk miatt
    - E miatt akarták a jobbágyok kedvére tenni a nemesek
    - Ebből jön az Érdek egyesítés
